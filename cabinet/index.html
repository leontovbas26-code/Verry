<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verry Marketplace — Кабинет</title>
    <meta name="theme-color" content="#000000">
    <style>
        :root {
            --bg-black: #000000;
            --bg-card: #0d0d0d;
            --gold: #fbbf24;
            --gold-alpha: rgba(251, 191, 36, 0.4);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-dark: #111827;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 24px;
            border-bottom: 1px solid var(--border-dark);
            background-color: var(--bg-black);
        }

        .header-container {
            max-width: 1152px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-decoration: none;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s ease;
        }

        nav a:hover { color: var(--gold); }

        main {
            max-width: 1152px;
            width: 100%;
            margin: 0 auto;
            padding: 32px 16px;
            flex-grow: 1;
        }

        .hidden { display: none !important; }

        .auth-container {
            max-width: 400px;
            margin: 80px auto;
            background-color: var(--bg-card);
            border: 1px solid var(--gold-alpha);
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .auth-container h2 {
            font-size: 22px;
            margin-bottom: 24px;
            text-align: center;
            font-weight: 900;
        }

        .form-group { margin-bottom: 16px; }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-black);
            border: 1px solid var(--border-dark);
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
        }

        .form-group input:focus { border-color: var(--gold); }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--gold);
            color: var(--bg-black);
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .btn:active { transform: scale(0.98); }
        .btn:disabled { background-color: #1f2937; color: #4b5563; cursor: wait; }

        .auth-msg {
            min-height: 20px;
            font-size: 13px;
            color: #ef4444;
            text-align: center;
            margin-top: 12px;
            line-height: 1.4;
        }

        .toggle-auth {
            display: block;
            margin: 10px auto 0;
            background: none;
            border: none;
            color: var(--gold);
            font-size: 13px;
            cursor: pointer;
        }
        .toggle-auth:hover { text-decoration: underline; }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-dark);
            margin-bottom: 32px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .market-card {
            border: 1px solid var(--gold-alpha);
            background-color: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            min-height: 130px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: border-color 0.2s ease;
        }

        .market-card:hover { border-color: var(--gold); }

        .card-title { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .card-value { font-size: 26px; font-weight: 900; color: var(--gold); margin-top: 8px; }

        .logout-btn {
            background: none;
            border: 1px solid #1f2937;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }
        .logout-btn:hover { border-color: #ef4444; color: #ef4444; }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <a class="logo" href="../">Verry</a>
            <nav><a href="../">← В каталог</a></nav>
        </div>
    </header>

    <main>
        <!-- Форма входа / регистрации -->
        <div id="authBlock" class="auth-container">
            <h2 id="authTitle">Вход в Verry</h2>
            <div class="form-group">
                <label for="username">Логин</label>
                <input type="text" id="username" placeholder="ваш логин" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
            </div>
            <button class="btn" id="authBtn" onclick="login()">Войти</button>
            <p class="auth-msg" id="authMsg"></p>
            <button class="toggle-auth" id="toggleAuth" onclick="toggleMode()">Нет аккаунта? Создать</button>
        </div>

        <!-- Личный кабинет пользователя -->
        <div id="userCabinet" class="hidden">
            <div class="panel-header">
                <div>
                    <h2 id="welcomeText">Личный кабинет</h2>
                    <p style="font-size: 14px; color: var(--text-muted);">Сессия сохранена на этом устройстве</p>
                </div>
                <button class="logout-btn" onclick="logout()">Выйти</button>
            </div>
            <div class="stats-grid">
                <div class="market-card">
                    <div class="card-title">Товаров в корзине</div>
                    <div class="card-value" id="stat-purchases">0 шт.</div>
                </div>
                <div class="market-card">
                    <div class="card-title">Баланс аккаунта</div>
                    <div class="card-value" id="stat-balance">0 ₽</div>
                </div>
            </div>
        </div>

        <!-- Панель Администратора -->
        <div id="adminPanel" class="hidden">
            <div class="panel-header">
                <div>
                    <h2>Панель администратора (Verry)</h2>
                    <p style="font-size: 14px; color: #10b981;">● Режим разработчика активен</p>
                </div>
                <button class="logout-btn" onclick="logout()">Выйти из панели</button>
            </div>
            <div class="stats-grid">
                <div class="market-card">
                    <div class="card-title">Пользователи на сайте</div>
                    <!-- Было захардкожено "Online: 1". Честный прочерк, пока на сервере
                         нет эндпоинта /api/online (готовый код — в отчёте). -->
                    <div class="card-value" id="admin-online-counter" style="color: #10b981;">—</div>
                </div>
                <div class="market-card">
                    <div class="card-title">Управление товарами</div>
                    <div class="card-value" style="font-size: 16px; margin-top: 12px;">Пока только через API сервера</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API_URL = 'https://verry-server.onrender.com';
        let isRegisterMode = false;

        // ИСПРАВЛЕНО: раньше логин принимал ЛЮБОЕ имя без пароля,
        // а слово "admin" давало админку кому угодно.
        // Теперь вход и регистрация идут через настоящие /api/login и /api/register,
        // роль и баланс приходят с сервера.
        window.onload = function() {
            const session = readSession();
            if (session) showPanel(session);
            // Вход по клавише Enter
            ['username', 'password'].forEach(id => {
                document.getElementById(id).addEventListener('keydown', e => {
                    if (e.key === 'Enter') login();
                });
            });
        }

        // Единый формат сессии: JSON-объект {username, role, balance}.
        // Раньше кабинет хранил простую строку, а каталог ждал объект — данные ломались.
        function readSession() {
            const raw = localStorage.getItem('verry_user');
            if (!raw) return null;
            try {
                const parsed = JSON.parse(raw);
                if (parsed && typeof parsed === 'object' && parsed.username) return parsed;
                throw new Error('legacy');
            } catch (e) {
                // Миграция старого формата (простая строка). Права админа из строки НЕ выдаём.
                const migrated = { username: raw, role: 'user', balance: 0 };
                localStorage.setItem('verry_user', JSON.stringify(migrated));
                return migrated;
            }
        }

        function toggleMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('authTitle').textContent = isRegisterMode ? 'Регистрация в Verry' : 'Вход в Verry';
            document.getElementById('authBtn').textContent = isRegisterMode ? 'Создать аккаунт' : 'Войти';
            document.getElementById('toggleAuth').textContent = isRegisterMode ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Создать';
            document.getElementById('authMsg').textContent = '';
        }

        async function login() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const msg = document.getElementById('authMsg');
            const btn = document.getElementById('authBtn');

            if (!user) { msg.textContent = 'Введите логин'; return; }
            if (!pass) { msg.textContent = 'Введите пароль'; return; }

            btn.disabled = true;
            btn.textContent = 'Подождите...';
            msg.textContent = '';
            try {
                const endpoint = isRegisterMode ? '/api/register' : '/api/login';
                const response = await fetch(API_URL + endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass }),
                    signal: AbortSignal.timeout(60000) // Render может просыпаться до минуты
                });
                const data = await response.json();
                if (data.success) {
                    const session = {
                        username: user,
                        role: (data.user && data.user.role) || 'user',
                        balance: (data.user && typeof data.user.balance === 'number') ? data.user.balance : 0
                    };
                    localStorage.setItem('verry_user', JSON.stringify(session));
                    showPanel(session);
                } else {
                    msg.textContent = data.error || 'Неверный логин или пароль';
                }
            } catch (e) {
                msg.textContent = 'Нет связи с сервером. Если он спал на Render — попробуйте ещё раз через минуту.';
            } finally {
                btn.disabled = false;
                btn.textContent = isRegisterMode ? 'Создать аккаунт' : 'Войти';
            }
        }

        function showPanel(session) {
            document.getElementById('authBlock').classList.add('hidden');

            if (session.role === 'admin') {
                document.getElementById('adminPanel').classList.remove('hidden');
            } else {
                document.getElementById('userCabinet').classList.remove('hidden');
                // textContent вместо innerHTML — защита от XSS через логин
                document.getElementById('welcomeText').textContent = 'Кабинет: ' + session.username;
            }

            // ИСПРАВЛЕНО: цифры больше не захардкожены — считаем из реальной корзины
            let count = 0;
            try {
                const cart = JSON.parse(localStorage.getItem('verry_cart'));
                if (Array.isArray(cart)) count = cart.reduce((sum, item) => sum + (Number(item.quantity) || 0), 0);
            } catch (e) { /* битый JSON игнорируем */ }
            document.getElementById('stat-purchases').textContent = count + ' шт.';
            document.getElementById('stat-balance').textContent = (session.balance ?? 0) + ' ₽';
        }

        function logout() {
            localStorage.removeItem('verry_user');
            location.reload();
        }
    </script>
</body>
</html>
