<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verry Marketplace</title>
    <!-- Твоя золотая иконка во вкладке браузера вместо серой планеты -->
    <link rel="icon" type="image/png" href="IMG_2415.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000000; color: #f3f4f6; font-family: sans-serif; }
        
        header {
            padding: 16px 24px; border-bottom: 1px solid #111827;
            background-color: #000000; position: sticky; top: 0; z-index: 50;
        }
        .header-container {
            max-width: 1200px; margin: 0 auto; display: flex;
            flex-direction: column; justify-content: space-between; align-items: center; gap: 16px;
        }
        @media (min-width: 768px) { .header-container { flex-direction: row; } }
        
        .logo-block { display: flex; align-items: center; }
        .logo-large { width: 128px; height: 128px; object-fit: contain; }
        
        nav { display: flex; gap: 24px; font-size: 14px; }
        .nav-link {
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            padding-bottom: 2px;
            transition: color 0.2s;
            font-size: 14px;
            text-decoration: none; /* Убирает стандартное подчёркивание ссылок */
        }
.nav-link:hover, .nav-link.active { color: #fbbf24; }
.nav-link.active { border-bottom: 2px solid #fbbf24; font-weight: bold; }

        nav button:hover, nav button.active { color: #fbbf24; }
        nav button.active { border-bottom: 2px solid #fbbf24; font-weight: bold; }

        main { max-width: 1200px; margin: 0 auto; padding: 16px 8px; }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
        }
        @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 14px; } }
        @media (min-width: 768px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 16px; } }
        @media (min-width: 1024px) { .grid { grid-template-columns: repeat(5, 1fr); gap: 16px; } }

        /* Твой стиль чёрных карточек с переливающейся золотой рамкой */
        .product-card {
            background-color: #0d0d0d !important;
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            min-height: 320px;
            z-index: 1;

        /* Изначально рамка 1 пиксель */
            border: 1px solid transparent;
            background-image: linear-gradient(#0d0d0d, #0d0d0d), linear-gradient(90deg, #fbbf24, #b45309, #fef08a, #ffffff, #fbbf24);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            background-size: 100% 100%, 300% 300%;
            animation: shimmer 4s infinite linear;

  /* Убираем border-width из transition, чтобы толщина и цвет при уходе курсора менялись МГНОВЕННО */
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }


        .product-card:hover {
   /* При наведении рамка становится 4 пикселя */
            border-width: 3px;
            background-image: linear-gradient(#241a05, #241a05), linear-gradient(90deg, #fbbf24, #b45309, #fef08a, #ffffff, #fbbf24);
            transform: scale(1.05);
            z-index: 30;
            box-shadow: 0 12px 30px rgba(251, 191, 36, 0.4);
        }
        
        .img-placeholder {
            width: 100%; height: 120px; background-color: #141414; border-radius: 8px;
            margin-bottom: 8px; display: flex; align-items: center; justify-content: center;
            font-size: 11px; color: #4b5563; border: 1px solid #111827;
        }
        
        h3 { font-size: 14px; color: #e5e7eb; font-weight: 600; line-height: 1.3; margin-bottom: 4px; }
        
        .product-desc {
            font-size: 11px; color: #9ca3af; margin-top: 6px;
            opacity: 0; max-height: 0; overflow: hidden;
            transition: opacity 0.2s ease, max-height 0.2s ease;
        }
        .product-card:hover .product-desc {
            opacity: 1; max-height: 100px;
        }
        
        .card-bottom { margin-top: 12px; padding-top: 8px; border-top: 1px solid #111827; display: flex; justify-content: space-between; align-items: center; }
        .price { font-size: 16px; font-weight: bold; color: #fbbf24; }
        
        .buy-btn {
            background-color: #fbbf24; color: #000000; font-size: 12px; font-weight: bold;
            padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; transition: transform 0.1s;
        }
        .buy-btn:active { transform: scale(0.95); }

        .page-section { width: 100%; }
        .hidden { display: none !important; }
        
        .info-box {
            border: 1px solid #111827; background-color: #0d0d0d; border-radius: 16px;
            padding: 24px; max-width: 448px; margin: 40px auto; text-align: center;
        }
        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group label { display: block; font-size: 12px; color: #9ca3af; margin-bottom: 6px; }
        .form-input {
            width: 100%; padding: 10px; background-color: #141414; border: 1px solid #1f2937;
            border-radius: 8px; color: white; font-size: 14px;
        }
        .form-input:focus { border-color: #fbbf24; outline: none; }
        .submit-btn {
            width: 100%; padding: 12px; background-color: #fbbf24; color: black;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        .toggle-auth { color: #fbbf24; font-size: 12px; cursor: pointer; background: none; border: none; margin-top: 12px; }

        #toast-container {
            position: fixed; top: 80px; right: 20px; z-index: 9999;
            display: flex; flex-direction: column; gap: 10px;
        }
        .toast {
            background-color: #0d0d0d; color: #f3f4f6; border: 2px solid #1f2937;
            padding: 14px 20px; border-radius: 8px; font-size: 14px; font-weight: 600;
            min-width: 280px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); position: relative;
            overflow: hidden; animation: slideIn 0.3s ease forwards;
        }
        @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast.hide { animation: slideOut 0.3s ease forwards; }
        @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(120%); opacity: 0; } }
        .toast-progress { position: absolute; bottom: 0; left: 0; height: 3px; width: 100%; animation: progress 2s linear forwards; }
        @keyframes progress { from { width: 100%; } to { width: 0%; } }
    </style>
</head>
<body>

    <div id="toast-container"></div>

<header>
    <div class="header-container">
        <div class="logo-block">
            <img src="IMG_2386.png" class="logo-large">
        </div>
        
        <!-- Вот сюда, внутри <header>, вместо старых кнопок мы ставим новые ссылки: -->
        <nav>
            <a href="/Verry/" id="nav-catalog" class="nav-link active">Каталог</a>
            <a href="/Verry/cabinet/" id="nav-cabinet" class="nav-link">Кабинет</a>
            <a href="/Verry/admin/" id="nav-admin" class="nav-link hidden">Админка 👑</a>
            <a href="/Verry/cart/" id="nav-cart" class="nav-link">Корзина</a>
        </nav>

    </div>
</header>
    <main>
        <!-- КАТАЛОГ -->
        <div id="page-catalog" class="page-section">
            <div class="grid" id="products-grid">
                <p style="color: #9ca3af; grid-column: 1/-1; text-align: center;">Загрузка товаров с сервера...</p>
            </div>
        </div>
    </main>
    <script>
    let currentUser = null;
    let isLoginMode = true;

    // Логика кастомных окон-сообщений
    function showToast(message, color = '#fbbf24') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.borderColor = color;
        toast.innerHTML = `<span>${message}</span><div class="toast-progress" style="background: ${color};"></div>`;
        container.appendChild(toast);
        setTimeout(() => { toast.classList.add('hide'); }, 1900);
        setTimeout(() => { toast.remove(); }, 2000);
    }
    </script>
    <script>
    // Загрузка товаров из базы
    async function loadProducts() {
        const grid = document.getElementById('products-grid');
        try {
            const response = await fetch('https://verry-server.onrender.com/api/products');
            const products = await response.json();
            grid.innerHTML = '';
            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div>
                        <div class="img-placeholder"><span>[ ${product.category || 'Товар'} ]</span></div>
                        <h3>${product.name}</h3>
                        <p style="font-size: 10px; color: #fbbf24; margin-top: 2px;">Осталось: ${product.stock} шт.</p>
                        <div class="product-desc">${product.description || ''}</div>
                    </div>
                    <div class="card-bottom">
                        <span class="price">${product.price} ₽</span>
                        <button onclick="buyProduct(${product.id})" class="buy-btn">Купить</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        } catch (error) {
            grid.innerHTML = `
                <div style="grid-column: 1/-1; margin: 20px auto; max-width: 500px; padding: 24px; border: 2px dashed #fbbf24; border-radius: 16px; background-color: #0d0d0d; text-align: center; line-height: 1.6; font-size: 15px;">
                    <span style="color: #fbbf24; font-weight: 600;">Наш сервер находиться в режиме офлайн и вы можете просмотреть только свой локальный профиль и корзину </span>
                    <span style="color: #9ca3af; display: block; margin-top: 8px; font-size: 13px;">Извините за неудобства</span>
                </div>
            `;
        }
    }

    // Списание баланса и резерв на сервере
    async function buyProduct(productId) {
        if (!currentUser) return showToast('Ошибка: Сначала войдите в Личный кабинет!', '#ef4444');
        try {
            const response = await fetch('https://verry-server.onrender.com/api/buy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUser.username, productId })
            });
            const data = await response.json();
            if (data.success) {
                showToast('🎉 Успешная покупка! Товар отправлен в Корзину.', '#fbbf24');
                currentUser.balance = data.newBalance;
                localStorage.setItem('verry_user', JSON.stringify(currentUser));
                updateUI();
                loadProducts();
            } else { showToast('Ошибка: ' + data.error, '#ef4444'); }
        } catch (e) { showToast('Нет связи с сервером.', '#

    function updateUI() {
    if (currentUser) {
        // Защита: если элементы авторизации есть на странице, скрываем их
        const authFormBlock = document.getElementById('auth-form-block');
        if (authFormBlock) authFormBlock.classList.add('hidden');

        const profileBlock = document.getElementById('profile-block');
        if (profileBlock) profileBlock.classList.remove('hidden');

        const profileName = document.getElementById('profile-name');
        if (profileName) profileName.innerText = 'Пользователь: ' + (currentUser.username || 'admin');

        // Безопасный вывод баланса (если его нет у админа, покажет 0)
        const profileBalance = document.getElementById('profile-balance');
        if (profileBalance) {
            profileBalance.innerText = (currentUser.balance !== undefined ? currentUser.balance : 0) + ' ₽';
        }

        // Если роль админа — показываем ссылку на админку
        const navAdmin = document.getElementById('nav-admin');
        if (navAdmin) {
            if (currentUser.role === 'admin') {
                navAdmin.classList.remove('hidden');
            } else {
                navAdmin.classList.add('hidden');
            }
        }
    } else {
        // Если пользователь вышел
        const authFormBlock = document.getElementById('auth-form-block');
        if (authFormBlock) authFormBlock.classList.remove('hidden');

        const profileBlock = document.getElementById('profile-block');
        if (profileBlock) profileBlock.classList.add('hidden');

        const navAdmin = document.getElementById('nav-admin');
        if (navAdmin) navAdmin.classList.add('hidden');
    }
}

function checkSavedSession() {
    const savedUser = localStorage.getItem('verry_user');
    if (savedUser) {
        try {
            // Если в localStorage лежит JSON-объект (обычный юзер)
            currentUser = JSON.parse(savedUser);
        } catch (e) {
            // If it's a plain string "admin" from the new cabinet
            currentUser = { username: savedUser, role: savedUser, balance: 0 };
        }
        updateUI();
    }
}

    function logout() {
        currentUser = null;
        localStorage.removeItem('verry_user');
        updateUI();
        showToast('Вы вышли из системы.', '#9ca3af');
    }

    // Кол-во человек
    // Замени старый setInterval на этот рабочий вариант:
setInterval(async () => {
    try {
        // Проверяем, есть ли вообще пользователь и его имя, чтобы не вызывать ошибку undefined
        const nameToSend = (currentUser && typeof currentUser === 'object') ? currentUser.username : null;

        const res = await fetch('https://onrender.com', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: nameToSend })
        });
        
        const data = await res.json();
        // Защита: проверяем, есть ли вообще элемент счетчика на этой странице
        const onlineCounterEl = document.getElementById('admin-online-counter');
        if (data.success && onlineCounterEl) {
            onlineCounterEl.innerText = data.online + ' чел.';
        }
    } catch (e) {
        // Ошибки сети не должны ломать остальной JavaScript
    }
}, 1000);
        
    checkSavedSession();
    loadProducts();
    </script>
</body>
</html>
