<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verry</title>
    <link rel="icon" type="image/png" href="https://githubusercontent.com">
    <style>
        body { background-color: #000000 !important; color: #f3f4f6 !important; font-family: sans-serif; margin: 0; padding: 0; }
        header { padding: 16px; border-bottom: 1px solid #1f2937; text-align: center; background-color: #000000; position: sticky; top: 0; z-index: 90; }
        header img { height: 40px; width: auto; object-fit: contain; }
        main { padding: 15px; max-width: 600px; margin: 0 auto; padding-bottom: 90px; }
        .page { display: none; }
        .page.active { display: block; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .card { border: 1px solid rgba(251, 191, 36, 0.4); background-color: #0d0d0d; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; }
        .img-placeholder { width: 100%; height: 110px; background-color: #141414; border-radius: 12px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #4b5563; border: 1px solid #111827; }
        .title { font-size: 14px; font-weight: 600; color: #e5e7eb; margin: 0 0 12px 0; }
        .footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #111827; padding-top: 8px; }
        .price { font-size: 16px; font-weight: bold; color: #fbbf24; }
        button.buy-btn { background-color: #fbbf24; color: #000000; border: none; font-size: 12px; font-weight: bold; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
        .page-title { font-size: 20px; font-weight: bold; color: #fbbf24; margin-bottom: 15px; }
        .account-box, .cart-box { background-color: #0d0d0d; border: 1px solid #1f2937; padding: 20px; border-radius: 16px; color: #9ca3af; }
        .profile-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid #1f2937; padding-bottom: 15px; }
        .profile-avatar { width: 55px; height: 55px; border-radius: 50%; border: 2px solid #fbbf24; background: #000; overflow: hidden; }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-info { display: flex; flex-direction: column; }
        .profile-name { color: #fff; font-size: 18px; font-weight: bold; }
        .profile-status { color: #fbbf24; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
        .balance-card { background: linear-gradient(135deg, #111115 0%, #1a1921 100%); border: 1px solid rgba(251, 191, 36, 0.3); padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .balance-num { font-size: 22px; font-weight: 900; color: #fbbf24; margin-top: 4px; }
        .action-btn { background-color: #1f2937; color: #fff; border: 1px solid #374151; padding: 8px 14px; font-size: 12px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .action-btn:hover { background-color: #374151; border-color: #fbbf24; }
        .promo-section { margin-top: 20px; border-top: 1px solid #1f2937; padding-top: 15px; text-align: left; }
        .promo-title { font-size: 13px; font-weight: bold; color: #e5e7eb; margin-bottom: 8px; }
        .promo-input-group { display: flex; gap: 8px; }
        .promo-input { flex-grow: 1; background-color: #141414; border: 1px solid #1f2937; color: #fff; padding: 10px; border-radius: 8px; font-size: 14px; }
        .promo-input:focus { border-color: #fbbf24; outline: none; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #1f2937; }
        .cart-item-info { display: flex; flex-direction: column; gap: 2px; }
        .cart-item-title { color: #fff; font-size: 14px; font-weight: bold; }
        .cart-item-price { color: #fbbf24; font-size: 13px; }
        .quantity-controls { display: flex; align-items: center; gap: 10px; }
        .qty-btn { background-color: #1f2937; color: #fff; border: 1px solid #374151; width: 28px; height: 28px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .cart-total { margin-top: 20px; text-align: right; font-size: 16px; font-weight: bold; color: #fff; }
        .cart-total span { color: #fbbf24; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background-color: #070707; border-top: 1px solid #1f2937; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #9ca3af; text-decoration: none; font-size: 11px; font-weight: 500; gap: 4px; background: none; border: none; padding: 0; cursor: pointer; width: 25%; height: 100%; justify-content: center; }
        .nav-item.active { color: #fbbf24; }
        .nav-icon { width: 10px; height: 10px; border-radius: 50px; background-color: #374151; }
        .nav-item.active .nav-icon { background-color: #fbbf24; }
        .status-msg { text-align: center; color: #fbbf24; padding: 15px; font-size: 13px; font-weight: 500; border: 1px dashed rgba(251, 191, 36, 0.4); border-radius: 12px; background-color: #0d0d0d; line-height: 1.5; margin-bottom: 20px; }
        .auth-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.9); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-modal { background: #0d0d0d; border: 1px solid #fbbf24; padding: 25px; border-radius: 20px; text-align: center; max-width: 350px; width: 100%; box-shadow: 0 0 20px rgba(251, 191, 36, 0.2); }
        .auth-logo { height: 40px; margin-bottom: 15px; }
        .auth-title { font-size: 18px; font-weight: bold; color: #fff; margin-bottom: 10px; }
        .auth-desc { font-size: 13px; color: #9ca3af; margin-bottom: 20px; line-height: 1.4; }
    </style>
</head>
<body>
    <div id="auth-screen" class="auth-overlay" style="display: none;">
        <div class="auth-modal">
            <img src="https://githubusercontent.com" class="auth-logo" alt="Verry">
            <div class="auth-title">Вход на площадку</div>
            <div class="auth-desc">Пожалуйста, введите ваше имя пользователя для авторизации в системе маркетплейса Verry.</div>
            <input type="text" id="auth-name-field" class="promo-input" style="width:100%; box-sizing:border-box; text-align:center;" placeholder="Ваш никнейм">
            <button class="action-btn" style="border-color:#fbbf24; width:100%; margin-top:15px; padding:12px; font-size:14px;" onclick="saveUserName()">Войти</button>
        </div>
    </div>
    <header>
        <a href="#"><img src="https://githubusercontent.com" alt="Verry"></a>
    </header>
