<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verry Marketplace</title>
    <style>
        /* Жестко прописываем премиальные цвета без внешних скриптов */
        body {
            background-color: #000000 !important;
            color: #f3f4f6 !important;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            padding: 24px;
            border-bottom: 1px solid #1f2937;
            text-align: center;
            background-color: #000000;
        }
        header img {
            height: 45px;
            width: auto;
        }
        nav {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        nav a {
            color: #9ca3af;
            text-decoration: none;
            font-size: 14px;
        }
        nav a.active {
            color: #fbbf24;
            border-bottom: 2px solid #fbbf24;
            padding-bottom: 2px;
        }
        main {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .card {
            border: 1px solid rgba(251, 191, 36, 0.4);
            background-color: #0d0d0d;
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .img-placeholder {
            width: 100%;
            height: 110px;
            background-color: #141414;
            border-radius: 12px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #4b5563;
            border: 1px solid #111827;
        }
        .title {
            font-size: 14px;
            font-weight: 600;
            color: #e5e7eb;
            margin: 0 0 12px 0;
        }
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #111827;
            padding-top: 8px;
        }
        .price {
            font-size: 16px;
            font-weight: bold;
            color: #fbbf24;
        }
        button {
            background-color: #fbbf24;
            color: #000000;
            border: none;
            font-size: 12px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Шапка сайта -->
    <header>
        <a href="#">
            <img src="https://raw.githubusercontent.com/leontovbas26-code/Verry/refs/heads/main/IMG_2386.png" alt="Verry">
        </a>
        <nav>
            <a href="#" class="active">Каталог</a>
            <a href="#">Кабинет</a>
        </nav>
    </header>

    <!-- Список товаров -->
    <main>
        <div class="grid">
            
            <!-- Карточка 1 -->
            <div class="card">
                <div>
                    <div class="img-placeholder"><span>[ Картинка ]</span></div>
                    <p class="title">Название товара</p>
                </div>
                <div class="footer">
                    <span class="price">990 ₽</span>
                    <button>Купить</button>
                </div>
            </div>

            <!-- Карточка 2 -->
            <div class="card">
                <div>
                    <div class="img-placeholder"><span>[ Картинка ]</span></div>
                    <p class="title">Название товара</p>
                </div>
                <div class="footer">
                    <span class="price">1 490 ₽</span>
                    <button>Купить</button>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
