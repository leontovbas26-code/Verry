<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verry Marketplace</title>
    <!-- Подключаем Tailwind CSS для красивых стилей -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-black text-[#f3f4f6] font-sans antialiased">

    <!-- Шапка сайта -->
    <header class="p-6 md:px-12 border-b border-gray-900 bg-black sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-3xl font-black text-[#fbbf24] tracking-wider uppercase">Verry</h1>
            <nav class="flex gap-6 text-sm text-gray-400">
                <button onclick="showPage('catalog')" id="nav-catalog" class="text-[#fbbf24] border-b border-[#fbbf24] pb-0.5 font-bold cursor-pointer">Каталог</button>
                <button onclick="showPage('cabinet')" id="nav-cabinet" class="hover:text-[#fbbf24] transition cursor-pointer">Кабинет</button>
                <button onclick="showPage('cart')" id="nav-cart" class="hover:text-[#fbbf24] transition cursor-pointer">Корзина</button>
            </nav>
        </div>
    </header>

    <!-- Основной блок -->
    <main class="max-w-6xl mx-auto px-3 md:px-6 py-8">
        
        <!-- СТРАНИЦА: КАТАЛОГ -->
        <div id="page-catalog" class="page-section">
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-6">
                <!-- Карточка товара 1 -->
                <div class="border border-[#fbbf24]/40 bg-[#0d0d0d] rounded-2xl p-3 flex flex-col justify-between shadow-lg hover:border-[#fbbf24] transition duration-300">
                    <div>
                        <div class="w-full h-28 md:h-40 bg-[#141414] rounded-xl mb-2 flex items-center justify-center text-xs text-gray-600 border border-gray-900 overflow-hidden">
                            <span>[ Картинка ]</span>
                        </div>
                        <h3 class="text-sm md:text-base font-semibold text-gray-200">Название товара</h3>
                    </div>
                    <div class="mt-3 pt-2 border-t border-gray-900 flex justify-between items-center">
                        <span class="text-base md:text-lg font-bold text-[#fbbf24]">990 ₽</span>
                        <button class="bg-[#fbbf24] text-black text-xs md:text-sm font-bold px-3 py-1.5 rounded-lg active:scale-95 transition cursor-pointer">Купить</button>
                    </div>
                </div>
                <!-- Карточка товара 2 -->
                <div class="border border-[#fbbf24]/40 bg-[#0d0d0d] rounded-2xl p-3 flex flex-col justify-between shadow-lg hover:border-[#fbbf24] transition duration-300">
                    <div>
                        <div class="w-full h-28 md:h-40 bg-[#141414] rounded-xl mb-2 flex items-center justify-center text-xs text-gray-600 border border-gray-900 overflow-hidden">
                            <span>[ Картинка ]</span>
                        </div>
                        <h3 class="text-sm md:text-base font-semibold text-gray-200">Название товара 2</h3>
                    </div>
                    <div class="mt-3 pt-2 border-t border-gray-900 flex justify-between items-center">
                        <span class="text-base md:text-lg font-bold text-[#fbbf24]">1 490 ₽</span>
                        <button class="bg-[#fbbf24] text-black text-xs md:text-sm font-bold px-3 py-1.5 rounded-lg active:scale-95 transition cursor-pointer">Купить</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- СТРАНИЦА: КАБИНЕТ -->
        <div id="page-cabinet" class="page-section hidden">
            <div class="border border-gray-900 bg-[#0d0d0d] rounded-2xl p-6 shadow-lg max-w-md mx-auto text-center">
                <h2 class="text-2xl font-bold text-[#fbbf24] mb-4">Личный кабинет</h2>
                <p class="text-gray-400 text-sm">Добро пожаловать в Verry Marketplace!</p>
            </div>
        </div>

        <!-- СТРАНИЦА: КОРЗИНА -->
        <div id="page-cart" class="page-section hidden">
            <div class="border border-gray-900 bg-[#0d0d0d] rounded-2xl p-6 shadow-lg max-w-md mx-auto text-center">
                <h2 class="text-2xl font-bold text-[#fbbf24] mb-4">Ваша корзина</h2>
                <p class="text-gray-400 text-sm">Здесь будут отображаться отложенные товары.</p>
            </div>
        </div>

    </main>

    <!-- Скрипт для мгновенного переключения страниц -->
    <script>
    function showPage(pageId) {
        // Прячем все страницы
        document.querySelectorAll('.page-section').forEach(page => {
            page.classList.add('hidden');
        });
        // Показываем нужную страницу
        document.getElementById('page-' + pageId).classList.remove('hidden');

        // Сбрасываем стили у всех кнопок навигации
        const navButtons = ['catalog', 'cabinet', 'cart'];
        navButtons.forEach(id => {
            const btn = document.getElementById('nav-' + id);
            btn.className = "hover:text-[#fbbf24] transition cursor-pointer";
        });

        // Подсвечиваем активную кнопку золотым
        const activeBtn = document.getElementById('nav-' + pageId);
        activeBtn.className = "text-[#fbbf24] border-b border-[#fbbf24] pb-0.5 font-bold cursor-pointer";
    }
    </script>
</body>
</html>
