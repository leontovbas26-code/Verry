<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verry Marketplace</title>
    <style>
        body {
            background-color: #000000 !important;
            color: #f3f4f6 !important;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            padding: 16px;
            border-bottom: 1px solid #1f2937;
            text-align: center;
            background-color: #000000;
        }
        header img {
            height: 40px;
            width: auto;
        }
        main {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 90px; /* Отступ снизу под меню */
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .card {
            border: 1px solid rgba(251, 191, 36, 0.4);
            background-color: #0d0d0d;
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .img-placeholder {
            width: 100%;
            height: 110px;
            background-color: #141414;
            border-radius: 12px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #4b5563;
            border: 1px solid #111827;
        }
        .title {
            font-size: 14px;
            font-weight: 600;
            color: #e5e7eb;
            margin: 0 0 12px 0;
        }
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #111827;
            padding-top: 8px;
        }
        .price {
            font-size: 16px;
            font-weight: bold;
            color: #fbbf24;
        }
        button {
            background-color: #fbbf24;
            color: #000000;
            border: none;
            font-size: 12px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
        }
        /* Нижняя панель навигации */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background-color: #070707;
            border-top: 1px solid #1f2937;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #9ca3af;
            text-decoration: none;
            font-size: 11px;
            font-weight: 500;
            gap: 4px;
        }
        .nav-item.active {
            color: #fbbf24;
        }
        .nav-icon {
            width: 20px;
            height: 20px;
            border-radius: 50px;
            background-color: #374151;
        }
        .nav-item.active .nav-icon {
            background-color: #fbbf24;
        }
    </style>
</head>
<body>

    <!-- Шапка сайта с твоим новым логотипом -->
    <header>
        <a href="#">
            <img src="https://raw.githubusercontent.com/leontovbas26-code/Verry/refs/heads/main/IMG_2386.png" alt="Verry">
        </a>
    </header>

    <!-- Список товаров -->
    <main>
        <div class="grid">
            
            <!-- Карточка 1 -->
            <div class="card">
                <div>
                    <div class="img-placeholder"><span>[ Картинка ]</span></div>
                    <p class="title">Название товара</p>
                </div>
                <div class="footer">
                    <span class="price">990 ₽</span>
                    <button>Купить</button>
                </div>
            </div>

            <!-- Карточка 2 -->
            <div class="card">
                <div>
                    <div class="img-placeholder"><span>[ Картинка ]</span></div>
                    <p class="title">Название товара</p>
                </div>
                <div class="footer">
                    <span class="price">1 490 ₽</span>
                    <button>Купить</button>
                </div>
            </div>

        </div>
    </main>

    <!-- Нижнее меню навигации -->
    <div class="bottom-nav">
        <a href="#" class="nav-item">
            <div class="nav-icon"></div>
            <span>Главная</span>
        </a>
        <a href="#" class="nav-item active">
            <div class="nav-icon"></div>
            <span>Каталог</span>
        </a>
        <a href="#" class="nav-item">
            <div class="nav-icon"></div>
            <span>Корзина</span>
        </a>
        <a href="#" class="nav-item">
            <div class="nav-icon"></div>
            <span>Аккаунт</span>
        </a>
    </div>

</body>
</html>
