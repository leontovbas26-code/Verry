<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verry Marketplace</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000000; color: #f3f4f6; font-family: sans-serif; }
        
        header {
            padding: 16px 24px;
            border-bottom: 1px solid #111827;
            background-color: #000000;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .header-container {
            max-width: 1152px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }
        @media (min-width: 768px) {
            .header-container { flex-direction: row; }
        }
        
        .logo-block { display: flex; align-items: center; }
        .logo-large { width: 64px; height: 64px; object-fit: contain; }
        
        nav { display: flex; gap: 24px; font-size: 14px; }
        nav button {
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            padding-bottom: 2px;
            transition: color 0.2s;
            font-size: 14px;
        }
        nav button:hover { color: #fbbf24; }
        nav button.active {
            color: #fbbf24;
            border-bottom: 2px solid #fbbf24;
            font-weight: bold;
        }

        main { max-width: 1152px; margin: 0 auto; padding: 32px 12px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        @media (min-width: 768px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 24px; } }
        @media (min-width: 1024px) { .grid { grid-template-columns: repeat(4, 1fr); } }

        .product-card {
            background-color: #0d0d0d;
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            border: 2px solid transparent;
            background-clip: padding-box;
        }
        .product-card::after {
            content: '';
            position: absolute;
            top: -2px; bottom: -2px; left: -2px; right: -2px;
            background: linear-gradient(135deg, #fbbf24, #b45309, #d97706, #fbbf24);
            background-size: 300% 300%;
            border-radius: 16px;
            z-index: -1;
            animation: goldShimmer 4s ease infinite;
        }
        @keyframes goldShimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .img-placeholder {
            width: 100%;
            height: 112px;
            background-color: #141414;
            border-radius: 12px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #4b5563;
            border: 1px solid #111827;
        }
        @media (min-width: 768px) { .img-placeholder { height: 160px; } }
        
        h3 { font-size: 14px; color: #e5e7eb; font-weight: 600; }
        @media (min-width: 768px) { h3 { font-size: 16px; } }
        
        .card-bottom { margin-top: 12px; padding-top: 8px; border-top: 1px solid #111827; display: flex; justify-content: space-between; align-items: center; }
        .price { font-size: 16px; font-weight: bold; color: #fbbf24; }
        @media (min-width: 768px) { .price { font-size: 18px; } }
        
        .buy-btn {
            background-color: #fbbf24;
            color: #000000;
            font-size: 12px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .buy-btn:active { transform: scale(0.95); }

        .page-section { width: 100%; }
        .hidden { display: none !important; }
        
        .info-box {
            border: 1px solid #111827;
            background-color: #0d0d0d;
            border-radius: 16px;
            padding: 24px;
            max-width: 448px;
            margin: 0 auto;
            text-align: center;
        }
        .info-box h2 { font-size: 24px; color: #fbbf24; margin-bottom: 16px; }
        .info-box p { color: #9ca3af; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo-block">
                <img src="IMG_2386.png" class="logo-large">
            </div>
            <nav>
                <button onclick="showPage('catalog')" id="nav-catalog" class="active">Каталог</button>
                <button onclick="showPage('cabinet')" id="nav-cabinet">Кабинет</button>
                <button onclick="showPage('cart')" id="nav-cart">Корзина</button>
            </nav>
        </div>
    </header>

    <main>
        <!-- СТРАНИЦА: КАТАЛОГ -->
        <div id="page-catalog" class="page-section">
            <!-- Сюда JS-скрипт будет сам загружать товары из базы данных -->
            <div class="grid" id="products-grid">
                <p style="color: #9ca3af; grid-column: 1/-1; text-align: center;">Загрузка товаров с сервера...</p>
            </div>
        </div>

        <!-- СТРАНИЦА: КАБИНЕТ -->
        <div id="page-cabinet" class="page-section hidden">
            <div class="info-box">
                <h2>Личный кабинет</h2>
                <p>Добро пожаловать в Verry Marketplace!</p>
            </div>
        </div>

        <!-- СТРАНИЦА: КОРЗИНА -->
        <div id="page-cart" class="page-section hidden">
            <div class="info-box">
                <h2>Ваша корзина</h2>
                <p>Здесь будут отображаться отложенные товары.</p>
            </div>
        </div>
    </main>

    <script>
    // Функция переключения вкладок
    function showPage(pageId) {
        document.querySelectorAll('.page-section').forEach(page => page.classList.add('hidden'));
        document.getElementById('page-' + pageId).classList.remove('hidden');

        document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
        document.getElementById('nav-' + pageId).classList.add('active');
    }

    // Главная функция: запрашиваем товары с твоего сервера на ПК
    async function loadProducts() {
        const grid = document.getElementById('products-grid');
        try {
            // Стучимся на твой локальный сервер Node.js
            const response = await fetch('http://localhost:3000/api/products');
            const products = await response.json();
            
            // Очищаем надпись "Загрузка..."
            grid.innerHTML = '';
            
            // Перебираем товары из базы данных и генерируем HTML
            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div>
                        <div class="img-placeholder"><span>[ Картинка ]</span></div>
                        <h3>${product.name}</h3>
                        <p style="font-size: 11px; color: #4b5563; margin-top: 4px;">На складе: ${product.stock} шт.</p>
                    </div>
                    <div class="card-bottom">
                        <span class="price">${product.price} ₽</span>
                        <button class="buy-btn">Купить</button>
                    </div>
                `;
                grid.appendChild(card);
            });
            
        } catch (error) {
            console.error('Ошибка:', error);
            grid.innerHTML = '<p style="color: #ef4444; grid-column: 1/-1; text-align: center;">❌ Ошибка: Сервер на ПК не запущен или недоступен</p>';
        }
    }

    // Запускаем загрузку товаров при открытии сайта
    loadProducts();
    </script>
</body>
</html>
