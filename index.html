<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verry Marketplace</title>
    <meta name="description" content="Verry — маркетплейс файлов. Каталог товаров в чёрно-золотом стиле.">
    <meta name="theme-color" content="#000000">

    <!-- PWA: один манифест (раньше было два дубля) -->
    <link rel="manifest" href="manifest.json">

    <!-- Иконки: пути и РЕГИСТР букв исправлены под реальное расположение файлов.
         Было: apple-touch-icon.png (файл .PNG), Verry/icon-512.PNG (лишняя папка),
         фавикон IMG_2415.png весом 640 КБ — теперь лёгкая icon-192.PNG (23 КБ). -->
    <link rel="icon" type="image/png" href="icon-192.PNG">
    <link rel="apple-touch-icon" href="apple-touch-icon.PNG">

    <!-- Режим приложения на iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Verry">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000000; color: #f3f4f6; font-family: sans-serif; }

        header {
            padding: 16px 24px; border-bottom: 1px solid #111827;
            background-color: #000000; position: sticky; top: 0; z-index: 50;
        }
        .header-container {
            max-width: 1200px; margin: 0 auto; display: flex;
            flex-direction: column; justify-content: space-between; align-items: center; gap: 16px;
        }
        @media (min-width: 768px) { .header-container { flex-direction: row; } }

        .logo-block { display: flex; align-items: center; }
        .logo-large { width: 128px; height: 128px; object-fit: contain; }

        nav { display: flex; gap: 24px; font-size: 14px; }
        .nav-link {
            background: none; border: none; color: #9ca3af; cursor: pointer;
            padding-bottom: 2px; transition: color 0.2s; font-size: 14px;
            text-decoration: none;
        }
        .nav-link:hover, .nav-link.active { color: #fbbf24; }
        .nav-link.active { border-bottom: 2px solid #fbbf24; font-weight: bold; }

        main { max-width: 1200px; margin: 0 auto; padding: 16px 8px; }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 14px; } }
        @media (min-width: 768px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 16px; } }
        @media (min-width: 1024px) { .grid { grid-template-columns: repeat(5, 1fr); gap: 16px; } }

        /* Чёрные карточки с переливающейся золотой рамкой */
        .product-card {
            background-color: #0d0d0d !important;
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            min-height: 320px;
            z-index: 1;
            border: 1px solid transparent;
            background-image: linear-gradient(#0d0d0d, #0d0d0d), linear-gradient(90deg, #fbbf24, #b45309, #fef08a, #ffffff, #fbbf24);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            background-size: 100% 100%, 300% 300%;
            animation: shimmer 4s infinite linear;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* ИСПРАВЛЕНО: этих @keyframes не было — анимация shimmer не работала вообще.
           Второй слой (градиент) шириной 300% сдвигается ровно на 2 своих ширины
           за цикл, поэтому перелив зациклен без рывка. */
        @keyframes shimmer {
            from { background-position: 0 0, 0% 0; }
            to   { background-position: 0 0, 300% 0; }
        }

        .product-card:hover {
            border-width: 3px;
            background-image: linear-gradient(#241a05, #241a05), linear-gradient(90deg, #fbbf24, #b45309, #fef08a, #ffffff, #fbbf24);
            transform: scale(1.05);
            z-index: 30;
            box-shadow: 0 12px 30px rgba(251, 191, 36, 0.4);
        }

        .img-placeholder {
            width: 100%; height: 120px; background-color: #141414; border-radius: 8px;
            margin-bottom: 8px; display: flex; align-items: center; justify-content: center;
            font-size: 11px; color: #4b5563; border: 1px solid #111827;
        }

        h3 { font-size: 14px; color: #e5e7eb; font-weight: 600; line-height: 1.3; margin-bottom: 4px; }

        .product-desc {
            font-size: 11px; color: #9ca3af; margin-top: 6px;
            opacity: 0; max-height: 0; overflow: hidden;
            transition: opacity 0.2s ease, max-height 0.2s ease;
        }
        .product-card:hover .product-desc { opacity: 1; max-height: 100px; }

        .card-bottom { margin-top: 12px; padding-top: 8px; border-top: 1px solid #111827; display: flex; justify-content: space-between; align-items: center; }
        .price { font-size: 16px; font-weight: bold; color: #fbbf24; }

        .buy-btn {
            background-color: #fbbf24; color: #000000; font-size: 12px; font-weight: bold;
            padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; transition: transform 0.1s;
        }
        .buy-btn:active { transform: scale(0.95); }
        .buy-btn:disabled { background-color: #1f2937; color: #4b5563; cursor: wait; }

        .page-section { width: 100%; }
        .hidden { display: none !important; }

        .retry-btn {
            margin-top: 14px; padding: 10px 22px; background-color: #fbbf24; color: #000;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px;
        }

        #toast-container {
            position: fixed; top: 80px; right: 20px; z-index: 9999;
            display: flex; flex-direction: column; gap: 10px;
        }
        .toast {
            background-color: #0d0d0d; color: #f3f4f6; border: 2px solid #1f2937;
            padding: 14px 20px; border-radius: 8px; font-size: 14px; font-weight: 600;
            min-width: 280px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); position: relative;
            overflow: hidden; animation: slideIn 0.3s ease forwards;
        }
        @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast.hide { animation: slideOut 0.3s ease forwards; }
        @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(120%); opacity: 0; } }
        .toast-progress { position: absolute; bottom: 0; left: 0; height: 3px; width: 100%; animation: progress 2s linear forwards; }
        @keyframes progress { from { width: 100%; } to { width: 0%; } }
    </style>
</head>
<body>

    <div id="toast-container"></div>

<header>
    <div class="header-container">
        <div class="logo-block">
            <img src="IMG_2386.png" class="logo-large" alt="Логотип Verry" width="128" height="128">
        </div>

        <!-- ИСПРАВЛЕНО: ссылки были /Verry/... — на verry.vercel.app это 404.
             Относительные ссылки работают и на Vercel, и на GitHub Pages.
             Админка живёт внутри Кабинета (панель adminPanel), отдельной страницы /admin/ нет. -->
        <nav>
            <a href="./" id="nav-catalog" class="nav-link active">Каталог</a>
            <a href="cabinet/" id="nav-cabinet" class="nav-link">Кабинет</a>
            <a href="cabinet/" id="nav-admin" class="nav-link hidden">Админка 👑</a>
            <a href="cart/" id="nav-cart" class="nav-link">Корзина</a>
        </nav>
    </div>
</header>
    <main>
        <!-- КАТАЛОГ -->
        <div id="page-catalog" class="page-section">
            <div class="grid" id="products-grid">
                <p style="color: #9ca3af; grid-column: 1/-1; text-align: center;">Загрузка товаров с сервера... (если сервер спал на Render, первый запуск может занять до минуты)</p>
            </div>
        </div>
    </main>
    <script>
    const API_URL = 'https://verry-server.onrender.com';
    let currentUser = null;
    const productsCache = new Map(); // товары по id — нужны, чтобы класть покупку в корзину

    // Экранирование HTML: защита от XSS через названия/описания товаров с сервера
    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, ch => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[ch]));
    }

    // Кастомные окна-сообщения (текст вставляется через textContent — безопасно)
    function showToast(message, color = '#fbbf24') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.borderColor = color;
        const text = document.createElement('span');
        text.textContent = message;
        const progress = document.createElement('div');
        progress.className = 'toast-progress';
        progress.style.background = color;
        toast.append(text, progress);
        container.appendChild(toast);
        setTimeout(() => toast.classList.add('hide'), 1900);
        setTimeout(() => toast.remove(), 2000);
    }

    // Чтение корзины с защитой от битого JSON в localStorage
    function readCart() {
        try {
            const parsed = JSON.parse(localStorage.getItem('verry_cart'));
            return Array.isArray(parsed) ? parsed : [];
        } catch { return []; }
    }
    </script>
    <script>
    // Загрузка товаров из базы
    async function loadProducts() {
        const grid = document.getElementById('products-grid');
        grid.innerHTML = '<p style="color: #9ca3af; grid-column: 1/-1; text-align: center;">Загрузка товаров с сервера...</p>';
        try {
            // Таймаут 60 сек: бесплатный Render просыпается до ~50 секунд
            const response = await fetch(API_URL + '/api/products', { signal: AbortSignal.timeout(60000) });
            if (!response.ok) throw new Error('HTTP ' + response.status);
            const products = await response.json();
            if (!Array.isArray(products)) throw new Error('Неверный формат ответа');

            productsCache.clear();
            grid.innerHTML = '';
            products.forEach(product => {
                productsCache.set(product.id, product);
                const card = document.createElement('div');
                card.className = 'product-card';
                // Все данные с сервера экранируются (escapeHtml)
                card.innerHTML = `
                    <div>
                        <div class="img-placeholder"><span>[ ${escapeHtml(product.category || 'Товар')} ]</span></div>
                        <h3>${escapeHtml(product.name)}</h3>
                        <p style="font-size: 10px; color: #fbbf24; margin-top: 2px;">Осталось: ${escapeHtml(product.stock)} шт.</p>
                        <div class="product-desc">${escapeHtml(product.description || '')}</div>
                    </div>
                    <div class="card-bottom">
                        <span class="price">${escapeHtml(product.price)} ₽</span>
                        <button onclick="buyProduct(${Number(product.id)}, this)" class="buy-btn">Купить</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        } catch (error) {
            grid.innerHTML = `
                <div style="grid-column: 1/-1; margin: 20px auto; max-width: 500px; padding: 24px; border: 2px dashed #fbbf24; border-radius: 16px; background-color: #0d0d0d; text-align: center; line-height: 1.6; font-size: 15px;">
                    <span style="color: #fbbf24; font-weight: 600;">Наш сервер находится в режиме офлайн — вы можете просмотреть только свой локальный профиль и корзину</span>
                    <span style="color: #9ca3af; display: block; margin-top: 8px; font-size: 13px;">Извините за неудобства. Если сервер просто просыпается, попробуйте ещё раз через минуту.</span>
                    <button class="retry-btn" onclick="loadProducts()">Повторить попытку</button>
                </div>
            `;
        }
    }

    // Списание баланса и резерв на сервере + ИСПРАВЛЕНО: товар теперь реально попадает в корзину
    async function buyProduct(productId, btn) {
        if (!currentUser) return showToast('Ошибка: сначала войдите в Личный кабинет!', '#ef4444');
        if (btn && btn.disabled) return; // защита от двойного клика
        if (btn) { btn.disabled = true; btn.textContent = '...'; }
        try {
            const response = await fetch(API_URL + '/api/buy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUser.username, productId })
            });
            const data = await response.json();
            if (data.success) {
                // Раньше товар НИКУДА не сохранялся, и корзина всегда была пустой.
                // Теперь кладём покупку в verry_cart — именно этот ключ читает cart/cart.js.
                const product = productsCache.get(productId);
                const cart = readCart();
                const existing = cart.find(item => String(item.id) === String(productId));
                if (existing) {
                    existing.quantity += 1;
                } else {
                    cart.push({
                        id: productId,
                        title: product ? product.name : 'Товар #' + productId,
                        price: product ? product.price : 0,
                        category: product ? product.category : '',
                        quantity: 1
                    });
                }
                localStorage.setItem('verry_cart', JSON.stringify(cart));

                showToast('🎉 Успешная покупка! Товар отправлен в Корзину.', '#fbbf24');
                if (typeof data.newBalance === 'number') currentUser.balance = data.newBalance;
                localStorage.setItem('verry_user', JSON.stringify(currentUser));
                updateUI();
                loadProducts();
            } else {
                showToast('Ошибка: ' + (data.error || 'неизвестная'), '#ef4444');
            }
        } catch (e) {
            showToast('Нет связи с сервером.', '#ef4444');
        } finally {
            if (btn) { btn.disabled = false; btn.textContent = 'Купить'; }
        }
    }

    function updateUI() {
        const navAdmin = document.getElementById('nav-admin');
        if (navAdmin) {
            // Ссылка на админку — только для роли admin (панель находится в Кабинете)
            navAdmin.classList.toggle('hidden', !(currentUser && currentUser.role === 'admin'));
        }
    }

    function checkSavedSession() {
        const savedUser = localStorage.getItem('verry_user');
        if (!savedUser) return;
        try {
            const parsed = JSON.parse(savedUser);
            if (parsed && typeof parsed === 'object' && parsed.username) {
                currentUser = parsed;
            } else {
                throw new Error('legacy');
            }
        } catch (e) {
            // Старый формат: кабинет сохранял простую строку.
            // ВАЖНО: строка "admin" больше НЕ даёт права админа — роль берётся только с сервера.
            currentUser = { username: savedUser, role: 'user', balance: 0 };
            localStorage.setItem('verry_user', JSON.stringify(currentUser));
        }
        updateUI();
    }

    function logout() {
        currentUser = null;
        localStorage.removeItem('verry_user');
        updateUI();
        showToast('Вы вышли из системы.', '#9ca3af');
    }

    // ИСПРАВЛЕНО: отсюда убран setInterval, который каждую СЕКУНДУ слал POST
    // на несуществующий адрес https://onrender.com (ошибки в консоли + лишняя нагрузка).
    // Эндпоинта онлайн-счётчика на сервере пока нет — готовый код для него есть в отчёте.

    checkSavedSession();
    loadProducts();
    </script>
</body>
</html>
