<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verry — Корзина</title>
    <style>
        /* Базовые стили точь-в-точь как на главной */
        body {
            background-color: #000000;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* Шапка сайта */
        header {
            padding: 24px;
            border-bottom: 1px solid #111827;
            background-color: #000000;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-container {
            max-width: 1152px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        @media (min-width: 768px) {
            .header-container {
                flex-direction: row;
            }
        }

        h1 {
            font-size: 30px;
            font-weight: 900;
            color: #fbbf24;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Навигация */
        nav {
            display: flex;
            gap: 24px;
            font-size: 14px;
        }

        nav a {
            color: #9ca3af;
            text-decoration: none;
            transition: color 0.2s;
        }

        nav a:hover {
            color: #fbbf24;
        }

        nav a.active {
            color: #fbbf24;
            border-bottom: 2px solid #fbbf24;
            padding-bottom: 2px;
        }

        /* Контент страницы */
        main {
            max-width: 600px;
            margin: 0 auto;
            padding: 32px 12px;
            box-sizing: border-box;
        }

        .page-title-block {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .page-title {
            font-size: 20px;
            font-weight: 700;
            margin: 0;
        }

        .back-btn {
            font-size: 14px;
            color: #9ca3af;
            text-decoration: none;
        }

        .back-btn:hover {
            color: #fbbf24;
        }

        /* Карточки товаров в корзине */
        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .cart-item {
            border: 1px solid rgba(251, 191, 36, 0.4);
            background-color: #0d0d0d;
            border-radius: 16px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            transition: border-color 0.3s;
        }

        .cart-item:hover {
            border-color: #fbbf24;
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .item-image {
            width: 64px;
            height: 64px;
            background-color: #141414;
            border-radius: 12px;
            border: 1px solid #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #4b5563;
        }

        .item-title {
            font-size: 15px;
            font-weight: 600;
            color: #e5e7eb;
            margin-bottom: 4px;
        }

        .item-price {
            font-size: 16px;
            font-weight: 700;
            color: #fbbf24;
        }

        .item-controls {
            display: flex;
            align-items: flex-end;
            gap: 12px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 13px;
        }

        .quantity-select {
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #111827;
            background-color: #141414;
            border-radius: 8px;
            padding: 4px 8px;
        }

        .quantity-select button {
            background: none;
            border: none;
            color: #f3f4f6;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Итоговый блок */
        .cart-summary {
            border: 1px solid rgba(251, 191, 36, 0.4);
            background-color: #0d0d0d;
            border-radius: 16px;
            padding: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 12px;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #111827;
            padding-top: 12px;
            margin-bottom: 20px;
        }

        .summary-total span:first-child {
            font-size: 16px;
            color: #e5e7eb;
        }

        .summary-total span:last-child {
            font-size: 20px;
            font-weight: bold;
            color: #fbbf24;
        }

        .checkout-btn {
            width: 100%;
            background-color: #fbbf24;
            color: #000000;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .checkout-btn:active {
            transform: scale(0.95);
        }

        .checkout-btn:disabled {
            background-color: #1f2937;
            color: #4b5563;
            cursor: not-allowed;
        }

        .empty-message {
            text-align: center;
            color: #4b5563;
            padding: 48px 0;
        }
    </style>
</head>
<body>

    <!-- ШАПКА VERRY -->
    <header>
        <div class="header-container">
            <h1>Verry</h1>
            <nav>
                <a href="../index.html">Каталог</a>
                <a href="../index.html#cabinet">Кабинет</a>
                <a href="../index.html#admin">Админка 👑</a>
                <a href="#" class="active">Корзина</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="page-title-block">
            <h2 class="page-title">Корзина товаров</h2>
            <a href="../index.html" class="back-btn">← Назад</a>
        </div>

        <div id="cart-container">
            <div class="cart-items" id="cart-items-list"></div>

            <div class="cart-summary" id="cart-summary-block" style="display: none;">
                <div class="summary-row">
                    <span>Выбрано позиций:</span>
                    <span id="total-count" style="color: #e5e7eb;">0</span>
                </div>
                <div class="summary-total">
                    <span>Итого к оплате:</span>
                    <span id="total-price">0 ₽</span>
                </div>
                <button class="checkout-btn" id="checkout-button" onclick="handleCheckout()">Купить</button>
            </div>

            <div class="empty-message" id="empty-message">
                <h3>Корзина пуста</h3>
                <p>Добавьте товары со страницы каталога</p>
            </div>
        </div>
    </main>

    <script src="cart.js"></script>
</body>
</html>
